[project]
name = "podscribe"
version = "0.0.0"
description = "Turn a Spotify podcast episode link into a transcribed, summarised Obsidian note"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-v --tb=short"
xfail_strict = true
markers = [
    "slow: loads a speech model or real audio (skipped by the pre-commit hook)",
    "integration: talks to a real external service",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
